name: Weekly review crawl (HelloPeter, Takealot, Google Play)

on:
  schedule:
    # Mondays 03:00 UTC (05:00 SAST) — mirrors the main app's other weekly cron
    - cron: "0 3 * * 1"
  workflow_dispatch: # lets you trigger a run manually from the Actions tab
    inputs:
      hp_from:
        description: "HelloPeter backfill start date (YYYY-MM-DD). Leave blank for the normal weekly window."
        required: false
        default: ""
      hp_to:
        description: "HelloPeter backfill end date (YYYY-MM-DD, inclusive). Leave blank for today."
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      # Each source runs independently — one failing shouldn't block the others.
      - name: Crawl HelloPeter
        working-directory: core
        run: python main.py
        continue-on-error: true
        env:
          HP_FROM: ${{ inputs.hp_from }}
          HP_TO: ${{ inputs.hp_to }}

      - name: Crawl Takealot
        working-directory: core
        run: python takealot_scraper.py
        continue-on-error: true

      - name: Crawl Google Play
        working-directory: appstores
        run: python run_appstore_pipeline.py
        continue-on-error: true
